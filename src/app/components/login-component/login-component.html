<h1>Login</h1>

<form createform="ngForm">
    <label>Username</label> <br>
    <input type="text" name="username" #username class="form-control"> <br>
    <br>

    <label>Password</label> <br>
    <input type="text" name="password" #password class="form-control"> <br>
    <br>

    <button (click)="login()">Login</button>
</form>
